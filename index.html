<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teachers:ital,wght@0,400..800;1,400..800&display=swap"
    rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/calculator" rel="stylesheet">
    <script type="module" src="script.js"></script>
</head>

<body>
    <h1>Simple Calculator App</h1>

    <div class="calculator-container">
        <div class="calculator">
            <div class="displays">
                <div class="secondary-display"></div>
                <div class="primary-display"></div>
            </div>
            <div class="buttons">
                <button class="input-numbers" id="9" value="9">9</button>
                <button class="input-numbers" id="8" value="8">8</button>
                <button class="input-numbers" id="7" value="7">7</button>
                <button class="operations" id="+">+</button>
                <button class="input-numbers" id="6" value="6">6</button>
                <button class="input-numbers" id="5" value="5">5</button>
                <button class="input-numbers" id="4" value="4">4</button>
                <button class="operations" id="-">-</button>
                <button class="input-numbers" id="3" value="3">3</button>
                <button class="input-numbers" id="2" value="2">2</button>
                <button class="input-numbers" id="1" value="1">1</button>
                <button class="operations" id="*">*</button>
                <button class="input-numbers" id="." value=".">.</button>
                <button class="input-numbers" id="0" value="0">0</button>
                <button class="operations" id="/">/</button>
                <button class="operations" id="=">=</button>
                <button id="backspace">&lt;</button>
                <button id="all-clear">AC</button>
            </div>
        </div>
    </div>
</body>

</html>
