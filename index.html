<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js"></script>
</head>
<body>
    <h1>Simple Calculator App</h1>
    
    <div class="calculator-container">
        <div class="calculator">
            <div class="displays">
                <div class="secondary-display"></div>
                <div class="primary-display"></div>
            </div>
            <div class="buttons">
                <button class="input-numbers" id="9">9</button>
                <button class="input-numbers" id="8">8</button>
                <button class="input-numbers" id="7">7</button>
                <button class="input-numbers" id="6">6</button>
                <button class="input-numbers" id="5">5</button>
                <button class="input-numbers" id="4">4</button>
                <button class="input-numbers" id="3">3</button>
                <button class="input-numbers" id="2">2</button>
                <button class="input-numbers" id="1">1</button>
                <button class="input-numbers" id="0">0</button>
                <button id="all-clear">AC</button>
                <button id="backspace">&it;&mdash;</button>
                <button class="operations" id="+">+</button>
                <button class="operations" id="-">-</button>
                <button class="operations" id="*">*</button>
                <button class="operations" id="/">/</button>
            </div>
        </div>
    </div>
</body>
</html>
