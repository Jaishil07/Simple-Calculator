<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teachers:ital,wght@0,400..800;1,400..800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/calculator" rel="stylesheet">
    <script type="module" src="script.js"></script>
</head>

<body>
    <h1>Simple Calculator App</h1>

    <div class="calculator-container">
        <div class="calculator">
            <div class="displays">
                <div class="secondary-display"></div>
                <div class="primary-display"></div>
            </div>
            <p>Calculator By Jaishil07</p>
            <div class="buttons">
                <button class="input-numbers" id="nine" value="9">9</button>
                <button class="input-numbers" id="eight" value="8">8</button>
                <button class="input-numbers" id="seven" value="7">7</button>
                <button class="operations" id="plus">+</button>
                <button class="input-numbers" id="six" value="6">6</button>
                <button class="input-numbers" id="five" value="5">5</button>
                <button class="input-numbers" id="four" value="4">4</button>
                <button class="operations" id="minus">-</button>
                <button class="input-numbers" id="three" value="3">3</button>
                <button class="input-numbers" id="two" value="2">2</button>
                <button class="input-numbers" id="one" value="1">1</button>
                <button class="operations" id="multiply">*</button>
                <button id="dot" value=".">.</button>
                <button class="input-numbers" id="zero" value="0">0</button>
                <button class="operations" id="divide">/</button>
                <button class="enter" id="equal">=</button>
                <button id="backspace">&lt;</button>
                <button id="all-clear">AC</button>
            </div>
        </div>
    </div>
</body>

</html>
